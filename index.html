// ── ИНИЦИАЛИЗАЦИЯ ──
// Создаёт экземпляр TonConnectUI и подписывается на изменение статуса подключения.
// onStatusChange — это и есть встроенный механизм SDK для восстановления сессии: при
// перезагрузке страницы SDK сам проверяет сохранённое подключение и, если оно валидно,
// вызывает этот колбэк с данными кошелька без каких-либо действий пользователя.
// SDK грузится с внешнего CDN асинхронно, поэтому при необходимости пробуем ещё раз —
// это не костыль, а обычная защита от медленной сети/задержки загрузки скрипта.
function initTonConnect(attemptsLeft){
  if(tonConnectUIInstance) return; // уже инициализирован
  if(!window.TON_CONNECT_UI){
    attemptsLeft = attemptsLeft===undefined ? 15 : attemptsLeft;
    if(attemptsLeft>0){ setTimeout(()=>initTonConnect(attemptsLeft-1), 300); }
    else console.warn('TonConnect UI SDK не загрузился');
    return;
  }

  const manifestUrl = new URL('tonconnect-manifest.json', window.location.href).toString();

  try{
    // Явно включаем восстановление сессии. После возврата из Tonkeeper
    // Telegram Mini App может получить фокус раньше, чем SDK закончит
    // восстановление bridge-сессии.
    tonConnectUIInstance = new TON_CONNECT_UI.TonConnectUI({
      manifestUrl,
      restoreConnection: true
    });

    // Единственная точка обработки статуса кошелька.
    // Важно: закрываем внутренний TonConnect modal вручную после успешного
    // ответа кошелька. Это убирает состояние "Continue in Tonkeeper...",
    // если Telegram/Android вернул приложение, но UI-модалка не успела
    // закрыться сама.
    tonConnectUIInstance.onStatusChange((wallet)=>{
      updateTonWalletUI(wallet);

      if(wallet && wallet.account && wallet.account.address){
        setTimeout(()=>{
          try{ tonConnectUIInstance?.closeModal?.(); }catch(e){}
        }, 0);
      }
    }, (error)=>{
      console.warn('TonConnect status error:', error);
    });

    // Не считаем "ещё не восстановлено" состоянием "кошелёк отключён".
    // После восстановления ещё раз синхронизируем собственный интерфейс.
    if(tonConnectUIInstance.connectionRestored){
      tonConnectUIInstance.connectionRestored.then((restored)=>{
        try{
          if(restored && tonConnectUIInstance?.wallet){
            updateTonWalletUI(tonConnectUIInstance.wallet);
            tonConnectUIInstance.closeModal?.();
          }
        }catch(e){}
      }).catch(()=>{});
    }
  }catch(e){
    tonConnectUIInstance = null;
    console.error('TonConnect constructor error:', e);
  }
}

// ── ПОДКЛЮЧЕНИЕ ──
// Открывает стандартное модальное окно выбора кошелька TonConnect (Tonkeeper, MyTonWallet и т.д.) —
// тот же флоу, что и в других TON-приложениях.

  playClick();haptic('light');
  if(!tonConnectUIInstance){
    // SDK мог ещё не успеть инициализироваться — пробуем прямо сейчас, а не молчим.
    try{ initTonConnect(); }catch(e){}
  }
  if(!tonConnectUIInstance){
    showToast(tApp('ton_sdk_not_ready'),'error');
    return;
  }

  try{
    // Не создаём второй запрос, если модалка уже открыта.
    if(tonConnectUIInstance.modalState?.status==='opened') return;
    await tonConnectUIInstance.openModal();
  }catch(e){
    console.warn('TonConnect openModal error:', e);
  }
}

// ── ОБНОВЛЕНИЕ ИНТЕРФЕЙСА ──
// Единая точка правды: скрывает кнопку и показывает карточку (или наоборот) в зависимости
// от текущего состояния кошелька. Вызывается и при ручном подключении/отключении,
// и автоматически при восстановлении сессии после перезагрузки.
function updateTonWalletUI(wallet){
  const btn=document.getElementById('ton-connect-prompt');
  const card=document.getElementById('wallet-profile-card');
  const inv=document.getElementById('wallet-inventories');
  if(!btn||!card) return;

  if(wallet && wallet.account && wallet.account.address){
    // Важно: адрес из TonConnect приходит в raw-формате (0:abcd...).
    // toUserFriendlyAddress — официальный метод SDK для получения user-friendly адреса (UQ.../EQ...),
    // именно его и нужно использовать, а не показывать raw-адрес.
    const friendly = TON_CONNECT_UI.toUserFriendlyAddress(wallet.account.address, false);
    tonWalletFullAddress = friendly;
    const addrEl=document.getElementById('wallet-profile-address');
    if(addrEl) addrEl.textContent = friendly.slice(0,4)+'...'+friendly.slice(-4);
    btn.style.display='none';
    card.style.display='flex';
    if(inv) inv.style.display='flex';
    applyWalletAvatar(friendly);
  } else {
    tonWalletFullAddress='';
    btn.style.display='flex';
    card.style.display='none';
    if(inv) inv.style.display='none';
    applyWalletAvatar(null);
  }
}

// ── АВАТАРКА КОШЕЛЬКА ──
// Без подключённого кошелька — стандартная иконка-заглушка. При подключении —
// автоматически сгенерированная аватарка (последняя буква адреса, синим, на белом фоне).
// Пользователь может заменить её своим фото — оно сохраняется локально по адресу кошелька.
function applyWalletAvatar(address){
  document.querySelectorAll('.wallet-avatar-slot').forEach(slot=>{
    const placeholder = slot.querySelector('.wallet-avatar-placeholder');
    const letterEl = slot.querySelector('.wallet-avatar-letter');
    const img = slot.querySelector('.wallet-avatar-img');
    if(!address){
      if(placeholder) placeholder.style.display='';
      if(letterEl) letterEl.style.display='none';
      if(img){ img.style.display='none'; img.src=''; }
      return;
    }
    let customPhoto=null;
    try{ customPhoto = localStorage.getItem('cp_wallet_avatar_'+address); }catch(e){}
    if(customPhoto){
      if(img){ img.src=customPhoto; img.style.display='block'; }
      if(placeholder) placeholder.style.display='none';
      if(letterEl) letterEl.style.display='none';
    } else {
      if(letterEl){ letterEl.textContent=address.slice(-1).toUpperCase(); letterEl.style.display='flex'; }
      if(placeholder) placeholder.style.display='none';
      if(img){ img.style.display='none'; img.src=''; }
    }
  });
}

function onWalletAvatarPicked(e){

// ── НЕЗАВИСИМЫЙ ЗАПУСК ──
// TON Connect намеренно запускается отдельно от общей функции инициализации приложения:
// если что-либо ДРУГОЕ в общем запуске бросит ошибку (Telegram API, сокет, трекинг —
// всё это может падать вне Telegram), это не должно блокировать кошелёк. try/catch —
// дополнительная защита от неожиданных исключений именно в этом модуле.
// ── БЛОКИРОВКА ВЕРТИКАЛЬНЫХ СВАЙПОВ (Telegram Mini App) ──
// Отключает нативный жест Telegram "потянуть вниз — свернуть приложение" глобально,
// а не только в отдельных панелях — иначе с главного экрана экран можно утянуть свайпом.

// Android/Telegram: после возврата из Tonkeeper WebView может получить
// visibility/focus раньше, чем bridge-сессия успеет восстановиться.
// Повторно запускаем восстановление только если кошелёк всё ещё не виден.
// Это не создаёт новый TonConnectUI — используется тот же singleton.
let _tonReconnectTimer=null;
let _tonReconnectRunning=false;
function recoverTonConnection(){
  if(_tonReconnectRunning || !tonConnectUIInstance) return;
  if(tonConnectUIInstance.connected || tonConnectUIInstance.wallet) return;

  _tonReconnectRunning=true;
  const connector=tonConnectUIInstance.connector;
  try{
    if(connector && typeof connector.restoreConnection==='function'){
      Promise.resolve(connector.restoreConnection()).catch(()=>{}).finally(()=>{
        _tonReconnectRunning=false;
      });
    }else{
      _tonReconnectRunning=false;
    }
  }catch(e){
    _tonReconnectRunning=false;
  }
}

function scheduleTonConnectionRecovery(){
  if(_tonReconnectTimer) clearTimeout(_tonReconnectTimer);
  _tonReconnectTimer=setTimeout(()=>{
    _tonReconnectTimer=null;
    recoverTonConnection();
    // На Android bridge иногда появляется чуть позже первого кадра.
    setTimeout(recoverTonConnection, 1200);
  }, 250);
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', bootTonConnect);
}else{
  bootTonConnect();
}

// Ключевой момент для возврата из Tonkeeper в Telegram Mini App.
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible') scheduleTonConnectionRecovery();
});
window.addEventListener('pageshow', scheduleTonConnectionRecovery);
window.addEventListener('focus', scheduleTonConnectionRecovery);

const SERVER_URL=window.__ENV_SERVER_URL__||'';

// ═══════════════════════════════════════════════════════════
//  PLATES DB API
// ═══════════════════════════════════════════════════════════

function charsFromVals(ctry, v){
  v=v||{};
  if(ctry==='RU') return `${v.l1||''}${v.d1||''}${v.d2||''}${v.d3||''}${v.l2||''}${v.l3||''}`;
  if(ctry==='UA') return `${v.d1||''}${v.d2||''}${v.d3||''}${v.d4||''}${v.l1||''}${v.l2||''}`;
  if(ctry==='BY') return `${v.d1||''}${v.d2||''}${v.d3||''}${v.d4||''}${v.l1||''}${v.l2||''}`;
  if(ctry==='KZ') return `${v.d1||''}${v.d2||''}${v.d3||''}${v.l1||''}${v.l2||''}${v.l3||''}`;
  return '';
}
function getCharsOnly(){
  return charsFromVals(country, vals);
}

// Обратное к getCharsOnly(): раскладывает строку символов, пришедшую с сервера,
// обратно по именованным слотам (l1,d1,d2... и т.д.) в том же порядке, в котором
// они склеиваются в getCharsOnly() — порядок и регистр каждого символа сохраняются как есть.
function charsToVals(ctry, chars){
  const out={};
  const slots=SLOTS_DEF[ctry]||[];
  const s=String(chars||'');
  slots.forEach((slot,i)=>{ out[slot.id]=s[i]||''; });
  return out;
}

// ── Резервирование гарантированно уникального номера ДО прокрутки ──
//
// Занятая комбинация не должна физически попасть на экран игроку, поэтому
// проверка на уникальность обязана происходить ДО визуальной прокрутки, а не
// после (как раньше). Вызывается прямо перед стартом анимации в spinOnly().
//
// Требуемый контракт бэкенда (когда БД будет подключена):
//   POST /plate/reserve  { telegram_id, country, region }
//   Сервер должен АТОМАРНО (в одной транзакции/с уникальным индексом в БД,
//   чтобы не было гонок между игроками, крутящими одновременно):
//     1. Сгенерировать случайный набор символов chars для этой страны/региона
//        по тем же правилам символов, что и в SLOTS_DEF (RU_L/RU_D/UA_L/BY_L/KZ_L).
//     2. Проверить, что комбинация (country, region, chars) ещё не существует
//        в таблице зарезервированных/выбитых номеров — лимит на каждую
//        вариацию строго 1, повторов быть не может.
//     3. Сразу же записать эту комбинацию в таблицу (застолбить), чтобы её
//        не выдало другому игроку, и вернуть её игроку:
//          → { ok:true, chars:'А111АА', plate_key:'ru_77_a111aa' }
//     Таблица в БД (одна строка = один сохранённый/зарезервированный номер):
//          plate_key (уникальный, PK)   — country+region+chars, например 'ru_77_a111aa'
//          country                       — 'RU' | 'UA' | 'BY' | 'KZ'
//          region                        — код региона, например '77', 'AA', '05'
//          chars                         — сам номер как есть, например 'А111АА'
//          telegram_id                   — кто выбил/владеет номером
//          created_at                    — когда зарезервирован
//        UNIQUE constraint на (country, region, chars) — гарантия, что дублей
//        не будет никогда, даже при одновременных запросах с разных устройств.
//     Если свободных комбинаций для этой страны/региона больше не осталось —
//     сервер отвечает { ok:false, exhausted:true }.
//   Если region ещё не отдавал ни одного номера, apiReleasePlate() освобождает
//   ранее зарезервированный, но не сохранённый в инвентарь номер (см. ниже) —
//   этот эндпоинт уже реализован и трогать не нужно.
//
// Пока сервер не подключён (или недоступен), функция возвращает {ok:true,
// offline:true} без chars — тогда spinOnly() временно генерирует номер локально
// без проверки на занятость (единственный вариант, доступный без БД).
async function apiReserveUniquePlate(ctry, region){
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),4000);
    const r=await fetch(`${SERVER_URL}/plate/reserve`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({telegram_id:getMyId(),country:ctry,region}),
      signal:ctrl.signal
    });
    clearTimeout(tid);
    return await r.json();
  }catch(e){
    return {ok:true,offline:true};
  }
}

// ── Присвоение постоянного номера минта (#1, #2, #3, ...) ──
//
// Номер минта — ОДНА общая, бесконечная, строго возрастающая последовательность
// на ВСЕХ игроков сразу (не своя у каждого игрока). Он никогда не повторяется
// и не может быть выдан дважды, даже если два разных игрока жмут "Сохранить"
// в один и тот же момент — это должно быть защищено атомарностью на сервере.
//
// Вызывается РОВНО ОДИН РАЗ — в момент сохранения номера в инвентарь
// (saveToInventory), именно тогда номер официально становится "заминченным".
// Дальше mint_no хранится как постоянная характеристика этого конкретного
// номерного знака (наравне со страной/регионом/самими символами) и уже
// никогда не меняется — в том числе если знак потом переходит между
// инвентарями/маркетплейсом в будущем.
//
// Требуемый контракт бэкенда:
//   POST /plate/mint  { telegram_id, plate_key, country, region, chars }
//   Сервер должен АТОМАРНО выдать следующее число из единого возрастающего
//   счётчика. Проще и надёжнее всего — обычный SERIAL/AUTO_INCREMENT столбец
//   в реляционной БД: сама база данных гарантирует, что при параллельных
//   запросах от разных игроков разные строки получат строго разные,
//   последовательные номера — этого достаточно и для защиты от одновременных
//   минтов, и для полного отсутствия повторов. Значений сколько угодно —
//   последовательность бесконечна по своей природе (обычный числовой
//   счётчик), переполнение практически невозможно.
//   Таблица (одна строка = один заминченный номер):
//        mint_no (SERIAL/AUTO_INCREMENT, PK, по возрастанию — 1,2,3...)
//        plate_key    — уникальный ключ самого номера (country+region+chars)
//        country, region, chars
//        telegram_id  — кто заминтил
//        created_at
//   Ответ: { ok:true, mint_no: 137 }
//
// Пока сервер не подключён — mint_no остаётся null (сам номер всё равно
// сохраняется в инвентарь локально), а бейдж "#N" на нём просто не
// показывается, пока не станет известен настоящий, окончательный номер минта.
async function apiMintPlate(plate_key, ctry, region, chars){
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),4000);
    const r=await fetch(`${SERVER_URL}/plate/mint`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({telegram_id:getMyId(),plate_key,country:ctry,region,chars}),
      signal:ctrl.signal
    });
    clearTimeout(tid);
    return await r.json();
  }catch(e){
    return {ok:false,offline:true};
  }
}

// ── ВРЕМЕННЫЙ локальный счётчик минтов (только пока не подключён сервер) ──
//
// Настоящий, окончательный #N (см. apiMintPlate выше) обязан приходить с
// сервера — только там можно гарантировать одну общую последовательность на
// ВСЕХ игроков без повторов при параллельных минтах. Эти локальные номера
// существуют только для того, чтобы интерфейс не выглядел пустым, пока
// бэкенд ещё не подключён: они уникальны только в пределах этого устройства
// и НЕ являются финальными — после подключения сервера apiMintPlate начнёт
// возвращать {ok:true, mint_no}, и эта ветка просто перестанет вызываться.
function _nextLocalMintNo(){
  let n=parseInt(localStorage.getItem('local_mint_counter')||'0',10);
  if(!Number.isFinite(n)||n<0) n=0;
  n+=1;
  try{ localStorage.setItem('local_mint_counter', String(n)); }catch(e){}
  return n;
}
// Проставляет временный локальный #N уже сохранённым ранее номерам, у которых
// его почему-то ещё нет (например были сохранены до того, как минт заработал).
function backfillLocalMintNumbers(){
  let changed=false;
  inventory.forEach(it=>{
    if(!it.mint_no){ it.mint_no=_nextLocalMintNo(); changed=true; }
  });
  if(changed) saveGame();
}

// ── Поиск номера в таблице занятых/сохранённых номеров ──

//     → { ok:true, found:true,  plate:{ country, region, chars, telegram_id, created_at } }
//     → { ok:true, found:false } — такого номера ни у кого нет
//   Пока сервер не подключён — offline:true, показываем нейтральное сообщение,
//   а не ложное "не найден".
async function apiSearchPlate(ctry, region, chars){

    const r=await fetch(`${SERVER_URL}/plate/search`,{

// Запускается по кнопке "Искать" в поиске
async function doPlateSearch(){

  playClick();haptic('light');

  const chars=slots.map(s=>searchVals[s.id]||'').join('');

}

// Получаем telegram_id текущего пользователя
let _cachedMyId=null;
function getMyId(){
  // Всегда проверяем TG ID первым — не кешируем до его появления
  try{
    const tgId=window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
    if(tgId){
      const id=String(tgId);
      _cachedMyId=id;
      return id;
    }
  }catch(e){}
  // Уже закешировали TG ID ранее
  if(_cachedMyId&&!_cachedMyId.startsWith('guest'))return _cachedMyId;
  // Fallback: гостевой ID (только если TG недоступен совсем)
  try{
    let gid=localStorage.getItem('_plates_guest_id');
    if(!gid){gid='guest_'+Math.random().toString(36).slice(2,9);localStorage.setItem('_plates_guest_id',gid);}
    // Не кешируем гостевой ID глобально — TG может появиться позже
    return gid;
  }catch(e){}
  return 'guest';
}

// ── Socket.IO подключение ──
let _socket=null;
function getSocket(){
  if(_socket&&_socket.connected)return _socket;
  // Подключаем Socket.IO из CDN
  if(!window.io){
    const s=document.createElement('script');
    s.src='https://cdn.socket.io/4.7.5/socket.io.min.js';
    s.onload=()=>{_socket=window.io(SERVER_URL);_setupSocket()};
    document.head.appendChild(s);
    return null;
  }
  _socket=window.io(SERVER_URL);
  _setupSocket();
  return _socket;
}

function _setupSocket(){
  if(!_socket)return;
  _socket.on('connect',()=>{
    // Регистрируем себя на сервере (сокет-соединение)
    const myId = getMyId();
    if (myId) _socket.emit('identify', { telegram_id: myId });
  });
}

// Парсим строку chars обратно в объект vals
// chars хранится без пробелов: RU="А777АА", UA="1234АВ", BY="1234АВ", KZ="123ABC"
function parsePlateChars(country,chars){
  if(!chars)return{};
  // Убираем пробелы, символы разделителей и регион (всё после | или -)
  const clean=chars.replace(/\s/g,'').split('|')[0].split('-')[0].toUpperCase();
  if(country==='RU'&&clean.length>=6)return{l1:clean[0],d1:clean[1],d2:clean[2],d3:clean[3],l2:clean[4],l3:clean[5]};
  if(country==='UA'&&clean.length>=6)return{d1:clean[0],d2:clean[1],d3:clean[2],d4:clean[3],l1:clean[4],l2:clean[5]};
  if(country==='BY'&&clean.length>=6)return{d1:clean[0],d2:clean[1],d3:clean[2],d4:clean[3],l1:clean[4],l2:clean[5]};
  if(country==='KZ'&&clean.length>=6)return{d1:clean[0],d2:clean[1],d3:clean[2],l1:clean[3],l2:clean[4],l3:clean[5]};
  return{};
}

// ══════════════════════════════════════════
//  HEADER PLATE — xxx drum-roll animation
// ══════════════════════════════════════════
(function(){
  const el=document.getElementById('hdr-plate-chars');
  if(!el)return;

  // Each "tick" shifts y between -20 and +20 simulating drum roll, then snaps back to 12
  const BASE_Y=12;
  let animFrame=null;

  function drumRoll(onDone){
    let ticks=0;
    const total=18;
    const offsets=[8,-8,6,-6,4,-4,2,-2,1,-1,0];
    function step(){
      if(ticks<total){
        // oscillate y to simulate barrel spinning
        const o=offsets[ticks%offsets.length]*(1-ticks/total);
        el.setAttribute('y', BASE_Y + o);
        el.setAttribute('opacity', ticks%2===0?'1':'0.5');
        ticks++;
        animFrame=setTimeout(step, 45);
      } else {
        el.setAttribute('y', BASE_Y);
        el.setAttribute('opacity','1');
        el.textContent='xxx';
        if(onDone) onDone();
      }
    }
    step();
  }

  function loop(){
    drumRoll(()=>{
      setTimeout(loop, 1800+Math.random()*1000);
    });
  }

  setTimeout(loop, 600);
})();

  window.addEventListener('pagehide', ()=>{
    dropCurrentSpunPlate({save:false});

  });
  window.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='hidden'){
      dropCurrentSpunPlate({save:false});

    }
  });
});
